# Variante del compose que NO construye nada: baja las imágenes ya
# publicadas en el registry público (ghcr.io) y las levanta.
#
# Es la diferencia entre "compilá el sistema en tu máquina" y
# "traé el artefacto ya construido y verificado". Lo segundo es lo que
# hace un servidor de producción: no tiene el código fuente ni el SDK,
# solo baja la imagen y la corre. La imagen es EL artefacto entregable.
#
#     docker compose -f docker-compose.registry.yml up -d
#
# Fijate que acá no hay ninguna clave "build": no hace falta el código.

services:

  db:
    image: postgres:16-alpine
    container_name: hmt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Imagen publicada, versionada con semver. Sin "build".
    image: ghcr.io/2319555-blason/hmt-backend:v0.1.0
    container_name: hmt-backend
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: ghcr.io/2319555-blason/hmt-frontend:v0.1.0
    container_name: hmt-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pgdata:
