name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    # Mínimo privilegio: sólo este job puede escribir paquetes (no todo el workflow).
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4
        with:
          # La imagen de BuildKit se baja de un espejo en ECR Public y no de Docker Hub:
          # desde los runners de GitHub, Docker Hub daba timeout y el job moría acá.
          driver-opts: image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1

      # ---------------- TP5: tests + cobertura + umbral del backend ----------------
      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test          # se detiene en la etapa "test" del Dockerfile, no llega a runtime
          load: true            # deja la imagen en el Docker del runner para poder hacer docker run
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests del backend con coverage (umbral 90%)
        run: |
          docker run --rm -v "${{ github.workspace }}/TestResults:/out" backend-test:ci \
            --collect:"XPlat Code Coverage"

      - name: Reporte de coverage del backend
        if: ${{ !cancelled() }}   # también cuando los tests o el umbral fallaron: ahí es cuando más se mira
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/*/coverage.cobertura.xml" -sourcedirs:backend \
            -targetdir:coveragereport "-reporttypes:Html;MarkdownSummaryGithub"
          echo "### Coverage del backend (umbral: 90% de línea y de rama)" >> $GITHUB_STEP_SUMMARY
          cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Publicar coverage y resultados del backend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: |
            coveragereport
            TestResults/tests.trx

      # ---------------- TP6: publicar el artefacto (sólo si TODO lo anterior pasó) ----------------
      # No hay un "if los tests pasaron": no hace falta. Los pasos corren en orden y el job muere
      # al primer error, así que si los tests o el umbral fallan, estos dos pasos nunca corren.
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ÚLTIMO paso, a propósito: se construye y publica DESPUÉS de verificar.
      # Publica sólo en un push a main (en los PRs construye pero no sube nada).
      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    # Mínimo privilegio: sólo este job puede escribir paquetes (no todo el workflow).
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4
        with:
          # La imagen de BuildKit se baja de un espejo en ECR Public y no de Docker Hub:
          # desde los runners de GitHub, Docker Hub daba timeout y el job moría acá.
          driver-opts: image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1

      # ---------------- TP5: tests + cobertura + umbral del frontend ----------------
      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage (umbral 90%)
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"          # si no está el archivo, el paso FALLA: mejor rojo que un resumen vacío
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend (umbral: 90% de línea y de rama)');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      # ---------------- TP6: publicar el artefacto (sólo si TODO lo anterior pasó) ----------------
      # No hay un "if los tests pasaron": no hace falta. Los pasos corren en orden y el job muere
      # al primer error, así que si los tests o el umbral fallan, estos dos pasos nunca corren.
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ÚLTIMO paso, a propósito: se construye y publica DESPUÉS de verificar.
      # Publica sólo en un push a main (en los PRs construye pero no sube nada).
      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ======================= TP6: promoción automática a QA =======================
  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]   # sin CI verde (tests + umbral + imágenes) no hay deploy
    if: github.ref == 'refs/heads/main'      # los PRs verifican; sólo main despliega
    environment: qa                          # hereda los secrets del environment qa (los hooks)
    steps:
      # TP7: Render ya no construye. El hook le dice QUÉ IMAGEN ejecutar (imgURL), la misma
      # sha-<commit> que publicaron los jobs de build de esta corrida. Sin &ref=: no hay nada que compilar.
      # --get --data-urlencode agrega "&imgURL=..." al hook (que ya trae ?key=) y codifica ':' y '/'.
      # La URL del hook va ÚLTIMA: --data-urlencode se lleva el valor que tiene al lado.
      - name: Desplegar en QA la IMAGEN del commit (api + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
          IMG_API: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          IMG_FRONT: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
        run: |
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API" > /dev/null
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT" > /dev/null
          echo "QA: deploy pedido de $IMG_API y $IMG_FRONT"

      # Reintenta 30 veces cada 20 s (~10 min): el free tier de Render tarda en construir y,
      # si el servicio estaba dormido, hasta un minuto en despertar. Un curl seco daría falsos rojos.
      # Prueba tres cosas: el proceso vive (/health), la base responde (/api/records) y el front sirve.
      - name: Smoke test de QA (con reintentos)
        shell: bash
        env:
          URL_API: https://hm-api-qa.onrender.com
          URL_FRONT: https://hm-front-qa.onrender.com
        run: |
          echo "Esperando a que QA responda..."
          for i in $(seq 1 30); do
            # --max-time en cada curl: un servicio despertando acepta la conexión y no contesta.
            if curl -fsS --max-time 10 "$URL_API/health" \
               && curl -fsS --max-time 10 "$URL_API/api/records" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/records" > /dev/null; then
              echo "✅ QA responde (API + base + front + front→API), intento $i"; exit 0
            fi
            echo "Intento $i: todavía no. Reintento en 20 s..."
            sleep 20
          done
          echo "❌ QA no respondió a tiempo"; exit 1

  # ============ TP7: integración — pedidos a la API de QA, sin navegador ============
  # Le habla a la API de QA YA DESPLEGADA (la imagen de esta corrida), con su Postgres de verdad.
  integracion:
    runs-on: ubuntu-latest
    needs: deploy-qa              # QA ya ejecuta la imagen de ESTA corrida (y el smoke la despertó)
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (sin navegador)
        run: npm ci                     # sin "playwright install": estas pruebas no abren browser
        working-directory: ./frontend

      - name: Integración contra la API de QA
        env:
          API_BASE_URL: https://hm-api-qa.onrender.com   # la API, no el front
        run: npx playwright test e2e/api.spec.js
        working-directory: ./frontend

      - name: Publicar reporte de integración
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}         # el reporte se publica también cuando falla
        with:
          name: playwright-report-integracion   # distinto del de e2e: dos iguales rompen la corrida
          path: frontend/playwright-report
          retention-days: 7

  # ============ TP7: e2e — un navegador de verdad usando el front de QA ============
  e2e:
    runs-on: ubuntu-latest
    needs: integracion            # si la API está rota, no gastamos un browser en confirmarlo
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias + navegador
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: ./frontend

      - name: e2e contra el front de QA
        env:
          E2E_BASE_URL: https://hm-front-qa.onrender.com
        run: npx playwright test e2e/records.spec.js
        working-directory: ./frontend

      - name: Publicar reporte e2e
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}         # importa MÁS cuando falla
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report
          retention-days: 7

  # ======================= TP6: el gate humano hacia PROD =======================
  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e                    # TP7 — EL gate: sin integración y e2e en verde, ni se pide aprobación.
                                  # No repite el "if: main": lo hereda por la cadena (deploy-qa no corre en PRs).
    environment: production       # ⏸ el workflow SE PAUSA acá hasta que un reviewer aprueba o rechaza
    concurrency:                  # nunca dos deploys a PROD pisándose
      group: deploy-prod
      cancel-in-progress: false
    steps:
      # La MISMA imagen que QA ya ejecutó y verificó (mismo sha-<commit>): eso es promover.
      # Nombrar la imagen exacta importa más que nunca: entre la pausa y la aprobación main se mueve.
      - name: Desplegar en PROD la MISMA IMAGEN que verificó QA (api + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
          IMG_API: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          IMG_FRONT: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
        run: |
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API" > /dev/null
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT" > /dev/null
          echo "PROD: deploy pedido de $IMG_API y $IMG_FRONT"

      - name: Smoke test de PROD (con reintentos)
        shell: bash
        env:
          URL_API: https://hm-api-prod.onrender.com
          URL_FRONT: https://hm-front-prod.onrender.com
        run: |
          echo "Esperando a que PROD responda..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/health" \
               && curl -fsS --max-time 10 "$URL_API/api/records" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/records" > /dev/null; then
              echo "✅ PROD responde (API + base + front + front→API), intento $i"; exit 0
            fi
            echo "Intento $i: todavía no. Reintento en 20 s..."
            sleep 20
          done
          echo "❌ PROD no respondió a tiempo"; exit 1
