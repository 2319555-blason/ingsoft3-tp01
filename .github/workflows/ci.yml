name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    # Mínimo privilegio: sólo este job puede escribir paquetes (no todo el workflow).
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4
        with:
          # La imagen de BuildKit se baja de un espejo en ECR Public y no de Docker Hub:
          # desde los runners de GitHub, Docker Hub daba timeout y el job moría acá.
          driver-opts: image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1

      # ---------------- TP5: tests + cobertura + umbral del backend ----------------
      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test          # se detiene en la etapa "test" del Dockerfile, no llega a runtime
          load: true            # deja la imagen en el Docker del runner para poder hacer docker run
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests del backend con coverage (umbral 90%)
        run: |
          docker run --rm -v "${{ github.workspace }}/TestResults:/out" backend-test:ci \
            --collect:"XPlat Code Coverage"

      - name: Reporte de coverage del backend
        if: ${{ !cancelled() }}   # también cuando los tests o el umbral fallaron: ahí es cuando más se mira
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/*/coverage.cobertura.xml" -sourcedirs:backend \
            -targetdir:coveragereport "-reporttypes:Html;MarkdownSummaryGithub"
          echo "### Coverage del backend (umbral: 90% de línea y de rama)" >> $GITHUB_STEP_SUMMARY
          cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Publicar coverage y resultados del backend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: |
            coveragereport
            TestResults/tests.trx

      # ---------------- TP6: publicar el artefacto (sólo si TODO lo anterior pasó) ----------------
      # No hay un "if los tests pasaron": no hace falta. Los pasos corren en orden y el job muere
      # al primer error, así que si los tests o el umbral fallan, estos dos pasos nunca corren.
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ÚLTIMO paso, a propósito: se construye y publica DESPUÉS de verificar.
      # Publica sólo en un push a main (en los PRs construye pero no sube nada).
      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    # Mínimo privilegio: sólo este job puede escribir paquetes (no todo el workflow).
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4
        with:
          # La imagen de BuildKit se baja de un espejo en ECR Public y no de Docker Hub:
          # desde los runners de GitHub, Docker Hub daba timeout y el job moría acá.
          driver-opts: image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1

      # ---------------- TP5: tests + cobertura + umbral del frontend ----------------
      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage (umbral 90%)
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"          # si no está el archivo, el paso FALLA: mejor rojo que un resumen vacío
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend (umbral: 90% de línea y de rama)');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      # ---------------- TP6: publicar el artefacto (sólo si TODO lo anterior pasó) ----------------
      # No hay un "if los tests pasaron": no hace falta. Los pasos corren en orden y el job muere
      # al primer error, así que si los tests o el umbral fallan, estos dos pasos nunca corren.
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ÚLTIMO paso, a propósito: se construye y publica DESPUÉS de verificar.
      # Publica sólo en un push a main (en los PRs construye pero no sube nada).
      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
