server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- Ruteo de la SPA ----------
    # React Router maneja las rutas del lado del navegador. Si alguien
    # entra directo a /records, ese archivo NO existe en el disco.
    # try_files busca el archivo, después la carpeta, y si no encuentra
    # ninguno devuelve index.html para que el router resuelva la ruta.
    # Sin esta línea, recargar la página en /records daría 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- Proxy hacia el backend ----------
    # El navegador NUNCA habla directo con el backend: le pide /api/...
    # al mismo origen del que se descargó la SPA, y nginx reenvía.
    #
    # "backend" es el nombre del servicio en el docker-compose. Docker
    # tiene un DNS interno que resuelve ese nombre a la IP del contenedor.
    #
    # No puede ser "localhost": para el navegador, localhost es la
    # computadora del usuario, no el contenedor. Ese es el error clásico.
    location /api/ {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
